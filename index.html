<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аналитика хлебозавода</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#efefec;
  --text:#1a1a18;--text2:#6b6b67;--text3:#9b9b97;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --teal:#1D9E75;--teal-light:rgba(29,158,117,0.08);
  --red:#E24B4A;--green:#639922;--blue:#378ADD;
  --radius:10px;--radius-lg:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#242422;--bg3:#2c2c2a;
  --text:#e8e6e0;--text2:#9b9b97;--text3:#6b6b67;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg3);min-height:100vh}
.page{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.card-white{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px}
h1{font-size:18px;font-weight:500;margin-bottom:2px}
h2{font-size:15px;font-weight:500;margin-bottom:4px}
.sub{font-size:12px;color:var(--text2);margin-bottom:12px}
textarea{width:100%;min-height:80px;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);padding:10px;font-family:inherit;font-size:13px;color:var(--text);resize:vertical;outline:none}
textarea:focus{border-color:var(--teal)}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{background:var(--text);color:var(--bg);border:none;border-radius:var(--radius);padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s;font-family:inherit}
button:hover{opacity:.8}
.btn-ghost{background:transparent;color:var(--text);border:0.5px solid var(--border2)}
.btn-ghost:hover{background:var(--bg2);opacity:1}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px}
.stat-val{font-size:20px;font-weight:500}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:2px}
.stat-diff{font-size:11px;margin-top:6px;min-height:18px}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.pill-up{background:#EAF3DE;color:#27500A}
.pill-dn{background:#FCEBEB;color:#791F1F}
.pill-eq{background:#F1EFE8;color:#444441}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ftab{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid var(--border2);color:var(--text2);background:transparent;font-family:inherit}
.ftab.on{background:var(--text);color:var(--bg);border-color:transparent}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-lbl{font-size:12px;width:130px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.bar-track{flex:1;height:18px;background:var(--bg);border-radius:4px;overflow:hidden;border:0.5px solid var(--border)}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.bar-val{font-size:11px;color:var(--text2);width:90px;text-align:right;flex-shrink:0}
.insight{border-left:2px solid;border-radius:0 var(--radius) var(--radius) 0;padding:8px 12px;font-size:13px;margin-bottom:6px;background:var(--bg)}
.insight.warn{border-color:var(--red)}
.insight.good{border-color:var(--green)}
.insight.info{border-color:var(--blue)}
.rec-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border);font-size:12px;cursor:pointer;color:var(--text2)}
.rec-row:last-child{border-bottom:none}
.rec-row:hover{color:var(--text)}
.rec-row.active-rec{color:var(--text);font-weight:500}
.hidden{display:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select{background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);padding:6px 10px;font-size:12px;color:var(--text);outline:none;font-family:inherit;width:100%}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;background:var(--bg3);color:var(--text2);border:0.5px solid var(--border)}
@media(max-width:500px){
  .stat-grid{grid-template-columns:1fr 1fr}
  .grid-2{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="page">

<div class="card">
  <div class="header-row">
    <div>
      <h1>Аналитика хлебозавода</h1>
      <div class="sub" style="margin-bottom:0">Вставь текст из Telegram — разберётся автоматически</div>
    </div>
    <span class="badge" id="rec-count">0 записей</span>
  </div>
  <textarea id="inp" placeholder="Анализ заказ на 05.05.2026. Всего-35010, хлеб-28758, нарезка-22706, лаваш-1607, булка-4602, сухарь пасхальный-43. Золотистый-1543, карельский-771, ржаное очарование-347, царское зерно-485, бородинский-1212, добрый-929, тостовый-1108.
Выдано-889691
Касса-4539109"></textarea>
  <div class="btn-row">
    <button onclick="parseAndSave()">Добавить день</button>
    <button class="btn-ghost" onclick="loadDemo()">Загрузить 7 дней для теста</button>
    <button class="btn-ghost" onclick="clearAll()" style="color:#E24B4A;border-color:#E24B4A">Очистить</button>
  </div>
</div>

<div id="main" class="hidden">

  <div class="card" id="stats-card"></div>

  <div class="card">
    <h2>Выводы</h2>
    <div style="margin-top:8px" id="insights"></div>
  </div>

  <div class="card">
    <div class="header-row" style="margin-bottom:8px">
      <h2 style="margin-bottom:0">Тренд</h2>
    </div>
    <div class="filters" id="period-filters">
      <button class="ftab on" onclick="setPeriod(3,this)">3 дня</button>
      <button class="ftab" onclick="setPeriod(7,this)">Неделя</button>
      <button class="ftab" onclick="setPeriod(30,this)">Месяц</button>
      <button class="ftab" onclick="setPeriod(9999,this)">Всё время</button>
    </div>
    <canvas id="trendChart" height="150"></canvas>
    <div class="filters" id="metric-filters" style="margin-top:12px">
      <button class="ftab on" onclick="setMetric('total',this)">Всего</button>
      <button class="ftab" onclick="setMetric('bread',this)">Хлеб</button>
      <button class="ftab" onclick="setMetric('slice',this)">Нарезка</button>
      <button class="ftab" onclick="setMetric('lavash',this)">Лаваш</button>
      <button class="ftab" onclick="setMetric('bun',this)">Булка</button>
      <button class="ftab" onclick="setMetric('cash',this)">Касса</button>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <h2>Категории</h2>
      <div style="margin-top:8px"><canvas id="catChart" height="220"></canvas></div>
    </div>
    <div class="card">
      <h2>Сорта хлеба</h2>
      <div style="margin-top:10px" id="sorts-bars"></div>
    </div>
  </div>

  <div class="card">
    <h2>Сравнить два дня</h2>
    <div class="two-col" style="margin:10px 0 14px">
      <div>
        <div class="sub" style="margin-bottom:4px">День А</div>
        <select id="cmpA" onchange="renderCompare()"></select>
      </div>
      <div>
        <div class="sub" style="margin-bottom:4px">День Б</div>
        <select id="cmpB" onchange="renderCompare()"></select>
      </div>
    </div>
    <div id="cmp-result"></div>
  </div>

  <div class="card">
    <h2>История записей</h2>
    <div style="margin-top:8px" id="history-list"></div>
  </div>

</div>
</div>

<script>
const KEY='bak_v4';
let trendChart=null,catChart=null,period=3,metric='total';

function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(arr){localStorage.setItem(KEY,JSON.stringify(arr))}

function parseText(txt){
  const r={date:null,total:null,bread:null,slice:null,lavash:null,bun:null,suhar:null,cash:null,issued:null,sorts:{}};
  const dm=txt.match(/(\d{2}\.\d{2}\.\d{4})/);if(dm)r.date=dm[1];
  [['total',/всего[-–—:]\s*([\d\s]+)/i],['bread',/хлеб[-–—:]\s*([\d\s]+)/i],
   ['slice',/нарезка[-–—:]\s*([\d\s]+)/i],['lavash',/лаваш[-–—:]\s*([\d\s]+)/i],
   ['bun',/булка[-–—:]\s*([\d\s]+)/i],['suhar',/сухарь[^,\n]*[-–—:]\s*([\d\s]+)/i],
   ['issued',/выдано[-–—:]\s*([\d\s]+)/i],['cash',/касса[-–—:]\s*([\d\s]+)/i]
  ].forEach(([k,rx])=>{const m=txt.match(rx);if(m)r[k]=parseInt(m[1].replace(/\s/g,''))});
  ['золотистый','карельский','ржаное очарование','царское зерно','бородинский','добрый','тостовый'].forEach(n=>{
    const m=txt.match(new RegExp(n+'\\s*[-–—:]\\s*([\\d\\s]+)','i'));
    if(m)r.sorts[n]=parseInt(m[1].replace(/\s/g,''));
  });
  return r;
}

function sortByDate(arr){
  return arr.slice().sort((a,b)=>{
    if(!a.date||!b.date)return 0;
    return a.date.split('.').reverse().join('').localeCompare(b.date.split('.').reverse().join(''));
  });
}

function fmt(n){return n!=null?n.toLocaleString('ru'):'—'}
function fmtK(n){if(n==null)return'—';if(n>=1000000)return(n/1000000).toFixed(1)+'М';if(n>=1000)return Math.round(n/1000)+'к';return n}

function pillDiff(a,b){
  if(a==null||b==null)return'';
  const d=a-b,p=b>0?(d/b*100).toFixed(1):0,s=d>0?'+':'';
  if(d>0)return`<span class="pill pill-up">${s}${d.toLocaleString('ru')} (${s}${p}%)</span>`;
  if(d<0)return`<span class="pill pill-dn">${d.toLocaleString('ru')} (${p}%)</span>`;
  return`<span class="pill pill-eq">без изменений</span>`;
}

function isDark(){return matchMedia('(prefers-color-scheme:dark)').matches}
function tc(){return isDark()?'#9b9b97':'#6b6b67'}
function gc(){return isDark()?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)'}

function renderStats(cur,prev){
  document.getElementById('stats-card').innerHTML=`
    <div class="header-row" style="margin-bottom:12px">
      <h2 style="margin-bottom:0">${cur.date||'Без даты'}</h2>
      <span class="badge">текущий день</span>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-val">${fmt(cur.total)}</div><div class="stat-lbl">Всего шт</div><div class="stat-diff">${pillDiff(cur.total,prev?.total)}</div></div>
      <div class="stat"><div class="stat-val">${fmtK(cur.cash)}</div><div class="stat-lbl">Касса руб</div><div class="stat-diff">${pillDiff(cur.cash,prev?.cash)}</div></div>
      <div class="stat"><div class="stat-val">${fmtK(cur.issued)}</div><div class="stat-lbl">Выдано руб</div><div class="stat-diff">${pillDiff(cur.issued,prev?.issued)}</div></div>
    </div>`;
}

function renderInsights(cur,prev){
  const ins=[];
  if(!prev){ins.push({t:'info',m:'Первая запись. Добавь ещё день — появится сравнение.'});}
  else{
    [{k:'slice',n:'Нарезка'},{k:'bread',n:'Хлеб'},{k:'lavash',n:'Лаваш'},{k:'bun',n:'Булка'}].forEach(({k,n})=>{
      if(cur[k]!=null&&prev[k]!=null){
        const d=cur[k]-prev[k],p=(d/prev[k]*100).toFixed(1);
        if(Math.abs(p)>=3)ins.push({t:d>0?'good':'warn',m:`${n}: ${d>0?'больше':'меньше'} на ${Math.abs(d).toLocaleString('ru')} шт (${Math.abs(p)}%) vs вчера`});
      }
    });
    Object.entries(cur.sorts).forEach(([name,val])=>{
      const pv=prev.sorts[name];
      if(pv!=null){const d=val-pv,p=(d/pv*100).toFixed(1);if(Math.abs(p)>=8)ins.push({t:d>0?'good':'warn',m:`${name.charAt(0).toUpperCase()+name.slice(1)}: ${d>0?'рост':'падение'} ${Math.abs(p)}%`});}
    });
    if(cur.cash!=null&&prev.cash!=null){
      const d=cur.cash-prev.cash,p=(d/prev.cash*100).toFixed(1);
      if(Math.abs(p)>=2)ins.push({t:d>0?'good':'warn',m:`Касса ${d>0?'выросла':'упала'} на ${Math.abs(p)}% — ${Math.abs(d).toLocaleString('ru')} руб`});
    }
  }
  if(!ins.length)ins.push({t:'info',m:'Показатели стабильны относительно вчера.'});
  document.getElementById('insights').innerHTML=ins.map(i=>`<div class="insight ${i.t}">${i.m}</div>`).join('');
}

function renderTrend(records){
  const slice=records.slice(-Math.min(period,records.length));
  const labels=slice.map(r=>r.date?.slice(0,5)||'?');
  const metricLabels={total:'Всего шт',bread:'Хлеб',slice:'Нарезка',lavash:'Лаваш',bun:'Булка',cash:'Касса'};
  const data=slice.map(r=>r[metric]||0);
  if(trendChart)trendChart.destroy();
  trendChart=new Chart(document.getElementById('trendChart'),{
    type:'line',
    data:{labels,datasets:[{label:metricLabels[metric],data,borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,0.07)',tension:0.35,pointRadius:4,pointBackgroundColor:'#1D9E75',fill:true}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.raw.toLocaleString('ru')}`}}},scales:{x:{ticks:{color:tc(),font:{size:11}},grid:{color:gc()}},y:{ticks:{color:tc(),font:{size:11},callback:v=>v>=1000?Math.round(v/1000)+'к':v},grid:{color:gc()}}}}
  });
}

function renderCatChart(cur,prev){
  if(catChart)catChart.destroy();
  const cats=[{k:'slice',n:'Нарезка'},{k:'lavash',n:'Лаваш'},{k:'bun',n:'Булка'},{k:'suhar',n:'Сухарь'}];
  catChart=new Chart(document.getElementById('catChart'),{
    type:'bar',
    data:{
      labels:cats.map(c=>c.n),
      datasets:[
        {label:'Сегодня',data:cats.map(c=>cur[c.k]||0),backgroundColor:'rgba(29,158,117,0.85)',borderRadius:5,borderSkipped:false},
        ...(prev?[{label:'Вчера',data:cats.map(c=>prev[c.k]||0),backgroundColor:'rgba(29,158,117,0.2)',borderRadius:5,borderSkipped:false}]:[])
      ]
    },
    options:{responsive:true,plugins:{legend:{labels:{color:tc(),font:{size:11}}},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.raw.toLocaleString('ru')}`}}},scales:{x:{ticks:{color:tc(),font:{size:11}},grid:{color:gc()}},y:{ticks:{color:tc(),font:{size:11},callback:v=>v.toLocaleString('ru')},grid:{color:gc()}}}}
  });
}

function renderSorts(cur,prev){
  const entries=Object.entries(cur.sorts).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){document.getElementById('sorts-bars').innerHTML='<div style="font-size:12px;color:var(--text2)">Нет данных по сортам</div>';return;}
  const max=Math.max(...entries.map(e=>e[1]),1);
  const colors=['#1D9E75','#534AB7','#D85A30','#378ADD','#639922','#BA7517','#D4537E'];
  document.getElementById('sorts-bars').innerHTML=entries.map(([name,val],i)=>{
    const pv=prev?.sorts[name];
    return`<div class="bar-row">
      <div class="bar-lbl" title="${name}">${name.charAt(0).toUpperCase()+name.slice(1)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(val/max*100)}%;background:${colors[i%colors.length]}"></div></div>
      <div class="bar-val">${val.toLocaleString('ru')} ${pv!=null?pillDiff(val,pv):''}</div>
    </div>`;
  }).join('');
}

function renderHistory(records,activeIdx){
  document.getElementById('history-list').innerHTML=records.slice().reverse().map((r,ri)=>{
    const idx=records.length-1-ri;
    return`<div class="rec-row${idx===activeIdx?' active-rec':''}" onclick="selectRecord(${idx})">
      <span>${r.date||'Без даты'}</span>
      <span>${fmt(r.total)} шт — ${fmtK(r.cash)} руб</span>
    </div>`;
  }).join('');
}

function updateCompareSelects(records){
  const opts=records.map((r,i)=>`<option value="${i}">${r.date||'Запись '+(i+1)}</option>`).join('');
  document.getElementById('cmpA').innerHTML=opts;
  document.getElementById('cmpB').innerHTML=opts;
  if(records.length>=2){document.getElementById('cmpA').value=records.length-2;document.getElementById('cmpB').value=records.length-1;}
  renderCompare();
}

function renderCompare(){
  const records=load();
  const a=records[+document.getElementById('cmpA').value];
  const b=records[+document.getElementById('cmpB').value];
  if(!a||!b)return;
  const fields=[{k:'total',n:'Всего шт'},{k:'bread',n:'Хлеб'},{k:'slice',n:'Нарезка'},{k:'lavash',n:'Лаваш'},{k:'bun',n:'Булка'},{k:'cash',n:'Касса'},{k:'issued',n:'Выдано'}];
  let html=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:8px;padding-bottom:6px;border-bottom:0.5px solid var(--border)">
    <div style="font-size:11px;color:var(--text2)">Показатель</div>
    <div style="font-size:11px;color:var(--text2);text-align:right">${a.date||'День А'}</div>
    <div style="font-size:11px;color:var(--text2);text-align:right">${b.date||'День Б'}</div>
  </div>`;
  fields.forEach(({k,n})=>{
    if(a[k]==null&&b[k]==null)return;
    const d=b[k]!=null&&a[k]!=null?b[k]-a[k]:null;
    const pct=d!=null&&a[k]>0?(d/a[k]*100).toFixed(1):null;
    const color=d>0?'#27500A':d<0?'#791F1F':'var(--text2)';
    html+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:6px 0;border-bottom:0.5px solid var(--border);align-items:center">
      <div style="font-size:12px">${n}</div>
      <div style="font-size:12px;text-align:right">${fmt(a[k])}</div>
      <div style="font-size:12px;text-align:right">${fmt(b[k])} ${pct!=null?`<span style="font-size:10px;color:${color}">(${d>0?'+':''}${pct}%)</span>`:''}</div>
    </div>`;
  });
  document.getElementById('cmp-result').innerHTML=html;
}

function renderAll(records,idx){
  if(!records.length)return;
  const cur=records[idx];
  const prev=idx>0?records[idx-1]:null;
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('rec-count').textContent=records.length+' '+(records.length===1?'запись':records.length<5?'записи':'записей');
  renderStats(cur,prev);
  renderInsights(cur,prev);
  renderTrend(records);
  renderCatChart(cur,prev);
  renderSorts(cur,prev);
  renderHistory(records,idx);
  updateCompareSelects(records);
}

function selectRecord(idx){renderAll(load(),idx);}
function setPeriod(p,btn){period=p;document.querySelectorAll('#period-filters .ftab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderTrend(load());}
function setMetric(m,btn){metric=m;document.querySelectorAll('#metric-filters .ftab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderTrend(load());}

function parseAndSave(){
  const txt=document.getElementById('inp').value.trim();
  if(!txt){alert('Вставь текст из Telegram');return;}
  const parsed=parseText(txt);
  if(!parsed.total&&!parsed.bread){alert('Не удалось разобрать. Проверь формат.');return;}
  const records=sortByDate([...load().filter(r=>r.date!==parsed.date),parsed]);
  save(records);
  const idx=records.findIndex(r=>r.date===parsed.date);
  renderAll(records,idx);
  document.getElementById('inp').value='';
}

function loadDemo(){
  const base=[34200,34800,35010,33900,35500,36100,34700];
  const dates=['28.04.2026','29.04.2026','30.04.2026','01.05.2026','02.05.2026','03.05.2026','04.05.2026'];
  const sorts=['золотистый','карельский','ржаное очарование','царское зерно','бородинский','добрый','тостовый'];
  const records=dates.map((date,i)=>{
    const t=base[i],bread=Math.round(t*0.82),sl=Math.round(t*0.65),lv=Math.round(t*0.046),bn=Math.round(t*0.13),su=Math.round(t*0.001);
    const sv={};sorts.forEach(s=>{sv[s]=Math.round((sl/sorts.length)*(0.8+Math.random()*0.4))});
    return{date,total:t,bread,slice:sl,lavash:lv,bun:bn,suhar:su,cash:Math.round(t*129.7),issued:Math.round(t*25.4),sorts:sv};
  });
  save(records);renderAll(records,records.length-1);
  document.getElementById('inp').value='';
}

function clearAll(){
  if(confirm('Удалить все записи?')){localStorage.removeItem(KEY);location.reload();}
}

const saved=sortByDate(load());
if(saved.length){save(saved);renderAll(saved,saved.length-1);}
</script>
